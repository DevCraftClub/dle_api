          additionalProperties:
            $ref: '#/components/schemas/UserXfieldField'
    ApiError:
      type: object
      description: 'Единый JSON-формат ошибки API v2: error, message, details?'
      properties:
        error:
          type: string
          description: 'Код ошибки'
          example: unauthorized
        message:
          type: string
          description: 'Человекочитаемое сообщение'
          example: 'Требуется Authorization: Bearer <AuthToken>'
        details:
          type:
            - object
            - 'null'
          description: 'Доп. детали (validation и т.п.)'
          additionalProperties: true
      required:
        - error
        - message
      example:
        error: unauthorized
        message: 'Требуется Authorization: Bearer <AuthToken>'
  responses:
    Unauthorized:
      description: 'Нет Authorization: Bearer или AuthToken недействителен/просрочен'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            missing:
              summary: 'Нет Bearer'
              value:
                error: unauthorized
                message: 'Требуется Authorization: Bearer <AuthToken>'
            invalid:
              summary: 'Неверный или просроченный token'
              value:
                error: unauthorized
                message: 'Недействительный или просроченный AuthToken'
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Access token из POST /oauth/token (credential_type или grant_type). Сырой API-ключ на ресурсах не принимается.'
      scheme: bearer
      bearerFormat: AuthToken
    rawApiKeyBearer:
      type: http
      description: 'Сырой API-ключ только для GET /key/check. Формат: Authorization: Bearer <apiKey>.'
      scheme: bearer
      bearerFormat: 'API Key'
