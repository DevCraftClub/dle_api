openapi: 3.1.0
info:
  title: 'DLE API'
  description: 'Неофициальное REST API для DataLife Engine 20.0. Поверхность: /api/v2. Ресурсы: Authorization: Bearer <AuthToken>. Выдача: POST /oauth/token с credential_type=api_key|auth|oauth_client или grant_type. Discovery: /.well-known/oauth-authorization-server. Identity: GET /me и /oauth/userinfo. Проверка сырого ключа: GET /key/check.'
  version: 200.1.1
servers:
  -
    url: '{apiBase}'
    description: 'Базовый URL API (подставьте свой хост, напр. https://example.com/api/v2)'
    variables:
      apiBase:
        default: /api/v2
        description: 'Путь или полный URL до /api/v2'
  -
    url: /api/v2
    description: 'Относительный путь по умолчанию'
paths:
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: 'Выдача AuthToken (credential_type или grant_type)'
      description: 'Предпочтительно credential_type=api_key|auth|oauth_client. Альтернатива: grant_type=client_credentials|password|authorization_code|refresh_token. В DEMO_MODE при успехе — authorized без access_token.'
      operationId: oauthToken
      requestBody:
        description: 'Параметры credential_type или OAuth2 grant'
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_type:
                  type: string
                  description: 'Предпочтительный способ выдачи AuthToken'
                  enum: [api_key, auth, oauth_client]
                grant_type:
                  type: string
                  enum: [client_credentials, authorization_code, refresh_token, password]
                api_key:
                  type: string
                  description: credential_type=api_key
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
                code:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
                username:
                  type: string
                  description: 'Логин или email (auth / password)'
                password:
                  type: string
            example:
              credential_type: api_key
              api_key: your_api_key
        required: true
      responses:
        '200':
          description: 'Токен выдан или DEMO_MODE authorized'
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: [string, 'null'] }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  demo_mode: { type: boolean }
                  authorized: { type: boolean }
                  message: { type: string }
              example:
                access_token: …
                token_type: Bearer
                expires_in: 3600
                refresh_token: …
        '400':
          description: 'Ошибка grant / credential'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security: []
  /.well-known/oauth-authorization-server:
    get:
      tags:
        - OAuth
      summary: 'OAuth AS discovery (без Bearer)'
      operationId: oauthDiscovery
      responses:
        '200':
          description: 'Метаданные AS'
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  revocation_endpoint: { type: string }
                  userinfo_endpoint: { type: string }
                  response_types_supported: { type: array, items: { type: string } }
                  grant_types_supported: { type: array, items: { type: string } }
                  code_challenge_methods_supported: { type: array, items: { type: string } }
                  token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
                  credential_types_supported: { type: array, items: { type: string } }
      security: []
  /me:
    get:
      tags:
        - Me
      summary: 'Субъект AuthToken (identity без CRUD-масок ПДн)'
      operationId: me
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: [string, 'null'] }
                  user_id: { type: integer }
                  name: { type: [string, 'null'] }
                  email: { type: [string, 'null'] }
                  user_group: { type: [integer, 'null'] }
                  user: { type: [object, 'null'], additionalProperties: true }
                  api_key_id: { type: integer }
                  access_level: { type: [object, 'null'], additionalProperties: true }
                  client_id: { type: [string, 'null'] }
                  auth_via: { type: string, example: access_token }
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          bearerAuth: []
  /key/check:
    get:
      tags:
        - Me
      summary: 'Проверка сырого API-ключа'
      description: 'Принимает Authorization: Bearer <apiKey>, возвращает ключ, scopes и payload `me`. `validTo = null` означает бессрочный ключ.'
      operationId: keyCheck
      responses:
        '200':
          description: 'Ключ валиден'
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: object, properties: { key: { type: string }, validFrom: { type: [string, 'null'], format: date-time }, validTo: { type: [string, 'null'], format: date-time, description: 'null = ключ бессрочный' }, accessLevel: { type: [object, 'null'], additionalProperties: true } } }
                  scopes: { type: object, additionalProperties: { type: object, properties: { read: { type: boolean }, write: { type: boolean }, edit: { type: boolean }, delete: { type: boolean } } } }
                  me: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          rawApiKeyBearer: []
  /oauth/userinfo:
    get:
      tags:
        - OAuth
      summary: 'OIDC-совместимый userinfo (тот же payload, что /me)'
      operationId: oauthUserinfo
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: [string, 'null'] }
                  user_id: { type: integer }
                  name: { type: [string, 'null'] }
                  email: { type: [string, 'null'] }
                  user_group: { type: [integer, 'null'] }
                  user: { type: [object, 'null'], additionalProperties: true }
                  api_key_id: { type: integer }
                  access_level: { type: [object, 'null'], additionalProperties: true }
                  client_id: { type: [string, 'null'] }
                  auth_via: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          bearerAuth: []
  /oauth/revoke:
    post:
      tags:
        - OAuth
      summary: 'Отзыв токена'
      operationId: oauthRevoke
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'Access или refresh token'
              required:
                - token
        required: true
      responses:
        '200':
          description: Отозван
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean, example: true }
              example:
                revoked: true
      security: []
  /post/:
    get:
      tags:
        - Post
      summary: 'Список новостей (фильтры как у /table/post/ + legacy headers)'
      description: 'Query-параметры колонок схемы; xf[name]=value для доп. полей; ! и % префиксы значений. Legacy: HTTP-заголовки с именами колонок (BC). category — virtual FK csv + post_extras_cats.'
      operationId: listPosts
      parameters:
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 20
        -
          name: offset
          in: query
          schema:
            type: integer
            default: 0
        -
          name: orderby
          in: query
          description: 'Колонка сортировки'
          schema:
            type: string
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
        -
          name: category
          in: query
          description: 'Virtual FK csv → category.id (FIND_IN_SET + post_extras_cats). !negate, %LIKE'
          schema:
            type: string
        -
          name: approve
          in: query
          schema:
            type: string
        -
          name: xf
          in: query
          description: 'Доп. поля: xf[field]=value (pad-LIKE по xfields). Пример: xf[title]=foo'
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Post' } }
                  count: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Post
      summary: 'Создание новости (sugar → prepare post)'
      operationId: createPost
      requestBody:
        description: 'Новость + optional nested children'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
        required: true
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
              example:
                id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Ошибка создания'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  '/post/{id}':
    get:
      tags:
        - Post
      summary: 'Новость по id'
      operationId: getPost
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Post' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Не найдено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  '/table/{name}':
    get:
      tags:
        - Table
      summary: 'Список записей таблицы с фильтрами'
      description: 'Любая таблица SchemaRegistry. Фильтры = query-параметры колонок. Virtual FK (RelationMap): csv→FIND_IN_SET, one→=. Операторы: !negate, %LIKE. Пример: /table/banners/?category=1&approve=1. xf[name] если есть колонка xfields.'
      operationId: listTableRows
      parameters:
        -
          name: name
          in: path
          description: 'Логическое имя таблицы SchemaRegistry (banners, post, category, …)'
          required: true
          schema:
            type: string
            description: 'Логическое имя таблицы SchemaRegistry'
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 20
        -
          name: offset
          in: query
          schema:
            type: integer
            default: 0
        -
          name: orderby
          in: query
          description: 'Колонка сортировки (из схемы)'
          schema:
            type: string
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
        -
          name: xf
          in: query
          description: 'Доп. поля (если у таблицы есть xfields): xf[field]=value. Пример: xf[title]=foo'
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TableRow' } }
                  count: { type: integer }
                  table: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Неизвестная таблица'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Неизвестная колонка / ошибка фильтра'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Table
      summary: 'Создание записи (Fluent prepare)'
      operationId: createTableRow
      parameters:
        -
          name: name
          in: path
          description: 'Логическое имя таблицы SchemaRegistry'
          required: true
          schema:
            type: string
            description: 'Логическое имя таблицы SchemaRegistry'
      requestBody:
        description: 'Колонки выбранной таблицы (+ optional nested children). Схема = oneOf TableRow.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRow'
        required: true
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  table: { type: string }
              example:
                id: 1
                table: banners
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Ошибка создания'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  '/table/{name}/{id}':
    get:
      tags:
        - Table
      summary: 'Запись по скалярному PK'
      operationId: getTableRow
      parameters:
        -
          name: name
          in: path
          required: true
          schema:
            type: string
            description: 'Логическое имя таблицы SchemaRegistry'
        -
          name: id
          in: path
          description: 'Значение первичного ключа'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TableRow' }
                  table: { type: string }
        '400':
          description: 'Составной PK не поддерживается через /{id}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Не найдено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Table
      summary: 'Обновление записи по скалярному PK'
      operationId: updateTableRow
      parameters:
        -
          name: name
          in: path
          required: true
          schema:
            type: string
            description: 'Логическое имя таблицы SchemaRegistry'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRow'
        required: true
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  table: { type: string }
                  updated: { type: boolean, example: true }
              example:
                id: '1'
                table: banners
                updated: true
        '400':
          description: 'Составной PK не поддерживается'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Не найдено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Ошибка обновления'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Table
      summary: 'Удаление записи по скалярному PK'
      operationId: deleteTableRow
      parameters:
        -
          name: name
          in: path
          required: true
          schema:
            type: string
            description: 'Логическое имя таблицы SchemaRegistry'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Удалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  table: { type: string }
                  deleted: { type: boolean, example: true }
              example:
                id: '1'
                table: banners
                deleted: true
        '400':
          description: 'Составной PK не поддерживается'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Не найдено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  /user/:
    post:
      tags:
        - User
      summary: 'Создание пользователя'
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Users'
        required: true
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
              example:
                id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Ошибка создания'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  /usergroup/:
    post:
      tags:
        - User
      summary: 'Создание группы пользователей'
      operationId: createUsergroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usergroups'
        required: true
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
              example:
                id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Ошибка создания'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  /plugin/:
    post:
      tags:
        - Plugin
      summary: 'Регистрация плагина'
      operationId: createPlugin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plugins'
        required: true
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
              example:
                id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Ошибка создания'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  /upload/:
    post:
      tags:
        - Upload
      summary: 'Загрузка файла (multipart)'
      operationId: uploadFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                subdir:
                  type: string
                  example: files
              required:
                - file
        required: true
      responses:
        '201':
          description: Загружено
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                url: /uploads/files/…
                name: file.jpg
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Ошибка загрузки'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  /conversations/:
    get:
      tags:
        - System
      summary: 'Список переписок'
      operationId: listConversations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Conversations' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          bearerAuth: []
  '/xfields/{scope}/':
    get:
      tags:
        - Xfield
      summary: 'Каталог доп. полей'
      operationId: listXfields
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
      responses:
        '200':
          description: 'OK (post → PostXfieldsCatalog, user → UserXfieldsCatalog)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { oneOf: [{ $ref: '#/components/schemas/PostXfieldsCatalog' }, { $ref: '#/components/schemas/UserXfieldsCatalog' }] }
                  scope: { type: string, enum: [post, user] }
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Xfield
      summary: 'Создать определение поля (typed validation)'
      operationId: createXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostXfieldField'
        required: true
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  scope: { type: string }
                  data: { $ref: '#/components/schemas/PostXfieldField' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'validation + details.fields'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  '/xfields/{scope}/encode':
    post:
      tags:
        - Xfield
      summary: 'Сериализация значений в формат post.xfields / users.xfields (аналог forPost)'
      description: 'Body: {fields:{name:value}} или {name,value}. Ответ: raw + parsed.'
      operationId: encodeXfields
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw: { type: string }
                  parsed: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'Неизвестное поле / validation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  '/xfields/{scope}/{name}':
    get:
      tags:
        - Xfield
      summary: 'Определение одного поля'
      operationId: getXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
        -
          name: name
          in: path
          required: true
          schema:
            type: string
        -
          name: as
          in: query
          description: 'Projection по типу (image, text, …)'
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PostXfieldField' }
                  scope: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Не найдено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Тип не совпадает с ?as='
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Xfield
      summary: 'Заменить определение поля'
      operationId: replaceXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
        -
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostXfieldField'
        required: true
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  updated: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/PostXfieldField' }
              example:
                name: myfield
                updated: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'validation + details.fields'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Xfield
      summary: 'Удалить определение поля'
      operationId: deleteXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
        -
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Удалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: myfield }
                  deleted: { type: boolean, example: true }
              example:
                name: myfield
                deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Поле не найдено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Ошибка удаления'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        -
          bearerAuth: []
  /health:
    get:
      tags:
        - System
      summary: 'Проверка API (без Bearer)'
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: 200.1.1 }
                  api: { type: string, example: v2 }
                  auth: { type: string, example: Bearer }
              example:
                version: 200.1.1
                api: v2
                auth: Bearer
      security: []
