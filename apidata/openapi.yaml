          type: integer
        use_editor:
          type: integer
        safe_mode:
          type: integer
        make_watermark:
          type: integer
        make_thumb:
          type: integer
        use_opengraph:
          type: string
        is_public:
          type: string
        date_local:
          type: string
        date_declension:
          type: string
        allow_in_news:
          type: integer
        lazy_load:
          type: string
      type: object
    PostXfieldGroup:
      description: 'Группа доп. полей новости (xfields.json → groups.*).'
      properties:
        title:
          description: 'Заголовок группы'
          type: string
        description:
          description: 'Описание группы'
          type: string
      type: object
    PostXfieldsCatalog:
      description: 'Каталог доп. полей новостей (xfields.json).'
      properties:
        fields:
          description: 'Карта полей: имя → определение'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PostXfieldField'
        groups:
          description: 'Карта групп: имя → определение'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PostXfieldGroup'
      type: object
    UserXfieldField:
      description: 'Описание доп. поля профиля (userxfields.json → fields.*).'
      properties:
        name:
          description: 'Системное имя поля'
          type: string
        description:
          description: 'Заголовок поля'
          type: string
        type:
          description: 'Тип поля'
          type: string
        condition:
          description: 'Условие отображения'
          type: string
        safe_mode:
          description: 'Безопасный режим (0/1)'
          type: integer
        registration:
          description: 'Показывать при регистрации (0/1)'
          type: integer
        allow_change:
          description: 'Разрешить изменение (0/1)'
          type: integer
        private:
          description: 'Приватное поле (0/1)'
          type: integer
      type: object
    UserXfieldsCatalog:
      description: 'Каталог доп. полей профиля (userxfields.json).'
      properties:
        fields:
          description: 'Карта полей: имя → определение'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserXfieldField'
      type: object
  responses:
    Unauthorized:
      description: 'Нет Authorization: Bearer или AuthToken недействителен/просрочен'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            missing:
              summary: 'Нет Bearer'
              value:
                error: unauthorized
                message: 'Требуется Authorization: Bearer <AuthToken>'
            invalid:
              summary: 'Неверный или просроченный token'
              value:
                error: unauthorized
                message: 'Недействительный или просроченный AuthToken'
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Access token из POST /oauth/token (credential_type или grant_type). Сырой API-ключ на ресурсах не принимается.'
      bearerFormat: AuthToken
      scheme: bearer
    rawApiKeyBearer:
      type: http
      description: 'Сырой API-ключ только для GET /key/check. Формат: Authorization: Bearer <apiKey>.'
      bearerFormat: 'API Key'
      scheme: bearer
tags:
  -
    name: OAuth
    description: 'Выдача и отзыв токенов, discovery, userinfo'
  -
    name: Me
    description: 'Субъект AuthToken и проверка сырого API-ключа'
  -
    name: Table
    description: 'Универсальный CRUD по SchemaRegistry: GET/POST /table/{name}/, GET/PUT/DELETE /table/{name}/{id}'
  -
    name: Post
    description: Новости
  -
    name: User
    description: 'Пользователи и группы'
  -
    name: Plugin
    description: Плагины
  -
    name: Upload
    description: 'Загрузка файлов'
  -
    name: Xfield
    description: 'Каталог доп. полей (xfields.json / userxfields.json)'
  -
    name: System
    description: Служебные
|||||||
=======
openapi: 3.0.0
info:
  title: 'DLE API'
  description: 'Неофициальное REST API для DataLife Engine 20.0. Единственная поверхность: /api/v2. Auth: Bearer (в т.ч. grant_type=password: username=name|email + password).'
  version: 200.1.0
servers:
  -
    url: '{apiBase}'
    description: 'Базовый URL API (подставьте свой хост, напр. https://example.com/api/v2)'
    variables:
      apiBase:
        default: /api/v2
        description: 'Путь или полный URL до /api/v2'
  -
    url: /api/v2
    description: 'Относительный путь по умолчанию'
paths:
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: 'Выдача access_token (в т.ч. password: username|email + password)'
      description: 'grant_type=password: username — логин (users.name) или email, password — пароль DLE; нужны client_id и client_secret.'
      operationId: oauthToken
      requestBody:
        description: 'Параметры OAuth2 grant'
        required: true
        content:
          application/json:
            schema:
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials, authorization_code, refresh_token, password]
                  example: password
                client_id:
                  description: 'ID OAuth-клиента'
                  type: string
                client_secret:
                  description: 'Секрет клиента'
                  type: string
                scope:
                  description: 'Запрашиваемые scope'
                  type: string
                code:
                  description: 'Код authorization_code'
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  description: 'PKCE verifier'
                  type: string
                refresh_token:
                  type: string
                username:
                  description: 'Логин (name) или email пользователя DLE (grant_type=password)'
                  type: string
                  example: admin
                password:
                  description: 'Пароль пользователя DLE (grant_type=password)'
                  type: string
                  example: secret
              type: object
            example:
              grant_type: password
              client_id: your_client_id
              client_secret: your_client_secret
              username: admin
              password: secret
      responses:
        '200':
          description: 'Токен выдан'
          content:
            application/json:
              schema:
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  scope: { type: string }
                type: object
        '400':
          description: 'Ошибка grant'
          content:
            application/json:
              schema:
                properties:
                  error: { type: string }
                  message: { type: string }
                type: object
      security: []
  /oauth/revoke:
    post:
      tags:
        - OAuth
      summary: 'Отзыв токена'
      operationId: oauthRevoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - token
              properties:
                token:
                  description: 'Access или refresh token'
                  type: string
              type: object
      responses:
        '200':
          description: Отозван
          content:
            application/json:
              schema:
                properties:
                  revoked: { type: boolean, example: true }
                type: object
      security: []
  /post/:
    get:
      tags:
        - Post
      summary: 'Список новостей (фильтры как у /table/post/ + legacy headers)'
      description: 'Query-параметры колонок схемы; xf[name]=value для доп. полей; ! и % префиксы значений. Legacy: HTTP-заголовки с именами колонок (BC). category — virtual FK csv + post_extras_cats.'
      operationId: listPosts
      parameters:
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 20
        -
          name: offset
          in: query
          schema:
            type: integer
            default: 0
        -
          name: orderby
          in: query
          description: 'Колонка сортировки'
          schema:
            type: string
        -
          name: sort
          in: query
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
        -
          name: category
          in: query
          description: 'Virtual FK csv → category.id (FIND_IN_SET + post_extras_cats). !negate, %LIKE'
          schema:
            type: string
        -
          name: approve
          in: query
          schema:
            type: string
        -
          name: xf
          in: query
          description: 'Доп. поля: xf[field]=value (pad-LIKE по xfields). Пример: xf[title]=foo'
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '401':
          description: 'Требуется Bearer'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Post
      summary: 'Создание новости (sugar → prepare post)'
      operationId: createPost
      requestBody:
        description: 'Новость + optional nested children'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                type: object
        '401':
          description: 'Требуется Bearer'
        '422':
          description: 'Ошибка создания'
      security:
        -
          bearerAuth: []
  '/post/{id}':
    get:
      tags:
        - Post
      summary: 'Новость по id'
      operationId: getPost
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: 'Требуется Bearer'
        '404':
          description: 'Не найдено'
      security:
        -
          bearerAuth: []
  '/table/{name}/':
    get:
      tags:
        - Table
      summary: 'Список записей таблицы с фильтрами'
      description: 'Любая таблица SchemaRegistry. Фильтры = query-параметры колонок. Virtual FK (RelationMap): csv→FIND_IN_SET, one→=. Операторы: !negate, %LIKE. Пример: /table/banners/?category=1&approve=1. xf[name] если есть колонка xfields.'
      operationId: listTableRows
      parameters:
        -
          name: name
          in: path
          description: 'Логическое имя таблицы SchemaRegistry (banners, post, category, …)'
          required: true
          schema:
            description: 'Логическое имя таблицы SchemaRegistry'
            type: string
        -
          name: limit
          in: query
          schema:
            type: integer
            default: 20
        -
          name: offset
          in: query
          schema:
            type: integer
            default: 0
        -
          name: orderby
          in: query
          description: 'Колонка сортировки (из схемы)'
          schema:
            type: string
        -
          name: sort
          in: query
          schema:
            type: string
            default: DESC
            enum:
              - ASC
              - DESC
        -
          name: xf
          in: query
          description: 'Доп. поля (если у таблицы есть xfields): xf[field]=value. Пример: xf[title]=foo'
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TableRow' } }
                  count: { type: integer }
                  table: { type: string }
                type: object
        '401':
          description: 'Требуется Bearer'
        '404':
          description: 'Неизвестная таблица'
        '422':
          description: 'Неизвестная колонка / ошибка фильтра'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Table
      summary: 'Создание записи (Fluent prepare)'
      operationId: createTableRow
      parameters:
        -
          name: name
          in: path
          description: 'Логическое имя таблицы SchemaRegistry'
          required: true
          schema:
            description: 'Логическое имя таблицы SchemaRegistry'
            type: string
      requestBody:
        description: 'Колонки выбранной таблицы (+ optional nested children). Схема = oneOf TableRow.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRow'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                  table: { type: string }
                type: object
        '401':
          description: 'Требуется Bearer'
        '422':
          description: 'Ошибка создания'
      security:
        -
          bearerAuth: []
  '/table/{name}/{id}':
    get:
      tags:
        - Table
      summary: 'Запись по скалярному PK'
      operationId: getTableRow
      parameters:
        -
          name: name
          in: path
          required: true
          schema:
            description: 'Логическое имя таблицы SchemaRegistry'
            type: string
        -
          name: id
          in: path
          description: 'Значение первичного ключа'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data: { $ref: '#/components/schemas/TableRow' }
                  table: { type: string }
                type: object
        '400':
          description: 'Составной PK не поддерживается через /{id}'
        '401':
          description: 'Требуется Bearer'
        '404':
          description: 'Не найдено'
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Table
      summary: 'Обновление записи по скалярному PK'
      operationId: updateTableRow
      parameters:
        -
          name: name
          in: path
          required: true
          schema:
            description: 'Логическое имя таблицы SchemaRegistry'
            type: string
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRow'
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema:
                properties:
                  id: { type: string }
                  table: { type: string }
                  updated: { type: boolean }
                type: object
        '400':
          description: 'Составной PK не поддерживается'
        '401':
          description: 'Требуется Bearer'
        '404':
          description: 'Не найдено'
        '422':
          description: 'Ошибка обновления'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Table
      summary: 'Удаление записи по скалярному PK'
      operationId: deleteTableRow
      parameters:
        -
          name: name
          in: path
          required: true
          schema:
            description: 'Логическое имя таблицы SchemaRegistry'
            type: string
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Удалено
          content:
            application/json:
              schema:
                properties:
                  id: { type: string }
                  table: { type: string }
                  deleted: { type: boolean }
                type: object
        '400':
          description: 'Составной PK не поддерживается'
        '401':
          description: 'Требуется Bearer'
        '404':
          description: 'Не найдено'
      security:
        -
          bearerAuth: []
  /user/:
    post:
      tags:
        - User
      summary: 'Создание пользователя'
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Users'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                type: object
        '401':
          description: 'Требуется Bearer'
        '422':
          description: 'Ошибка создания'
      security:
        -
          bearerAuth: []
  /usergroup/:
    post:
      tags:
        - User
      summary: 'Создание группы пользователей'
      operationId: createUsergroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usergroups'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                type: object
        '401':
          description: 'Требуется Bearer'
        '422':
          description: 'Ошибка создания'
      security:
        -
          bearerAuth: []
  /plugin/:
    post:
      tags:
        - Plugin
      summary: 'Регистрация плагина'
      operationId: createPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plugins'
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                properties:
                  id: { type: integer }
                type: object
        '401':
          description: 'Требуется Bearer'
        '422':
          description: 'Ошибка создания'
      security:
        -
          bearerAuth: []
  /upload/:
    post:
      tags:
        - Upload
      summary: 'Загрузка файла (multipart)'
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
              type: object
      responses:
        '201':
          description: Загружено
          content:
            application/json:
              schema:
                type: object
        '401':
          description: 'Требуется Bearer'
      security:
        -
          bearerAuth: []
  /conversations/:
    get:
      tags:
        - System
      summary: 'Список переписок'
      operationId: listConversations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversations'
        '401':
          description: 'Требуется Bearer'
      security:
        -
          bearerAuth: []
  '/xfields/{scope}/':
    get:
      tags:
        - Xfield
      summary: 'Каталог доп. полей'
      operationId: listXfields
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
      responses:
        '200':
          description: 'OK (post → PostXfieldsCatalog, user → UserXfieldsCatalog)'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/PostXfieldsCatalog' }
                  - { $ref: '#/components/schemas/UserXfieldsCatalog' }
        '401':
          description: 'Требуется Bearer'
      security:
        -
          bearerAuth: []
    post:
      tags:
        - Xfield
      summary: 'Создать определение поля (typed validation)'
      operationId: createXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostXfieldField'
      responses:
        '201':
          description: Создано
        '422':
          description: 'validation + details.fields'
      security:
        -
          bearerAuth: []
  '/xfields/{scope}/encode':
    post:
      tags:
        - Xfield
      summary: 'Сериализация значений в формат post.xfields / users.xfields (аналог forPost)'
      description: 'Body: {fields:{name:value}} или {name,value}. Ответ: raw + parsed.'
      operationId: encodeXfields
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '422':
          description: 'Неизвестное поле / validation'
      security:
        -
          bearerAuth: []
  '/xfields/{scope}/{name}':
    get:
      tags:
        - Xfield
      summary: 'Определение одного поля'
      operationId: getXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
        -
          name: name
          in: path
          required: true
          schema:
            type: string
        -
          name: as
          in: query
          description: 'Projection по типу (image, text, …)'
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostXfieldField'
        '404':
          description: 'Не найдено'
        '422':
          description: 'Тип не совпадает с ?as='
      security:
        -
          bearerAuth: []
    put:
      tags:
        - Xfield
      summary: 'Заменить определение поля'
      operationId: replaceXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
        -
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostXfieldField'
      responses:
        '200':
          description: Обновлено
        '422':
          description: 'validation + details.fields'
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - Xfield
      summary: 'Удалить определение поля'
      operationId: deleteXfield
      parameters:
        -
          name: scope
          in: path
          required: true
          schema:
            type: string
            enum:
              - post
              - user
        -
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Удалено
      security:
        -
          bearerAuth: []
  /health/:
    get:
      tags:
        - System
      summary: 'Проверка API'
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  ok: { type: boolean, example: true }
                  version: { type: string, example: 200.1.0 }
                type: object
        '401':
          description: 'Требуется Bearer'
      security:
        -
          bearerAuth: []
components:
