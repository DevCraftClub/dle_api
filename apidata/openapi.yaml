          description: 'Код ошибки'
          type: string
          example: unauthorized
        message:
          description: 'Человекочитаемое сообщение'
          type: string
          example: 'Требуется Authorization: Bearer <AuthToken>'
        details:
          description: 'Доп. детали (validation и т.п.)'
          type: object
          nullable: true
          additionalProperties: true
      type: object
      example:
