      type: object
      description: 'Каталог доп. полей новостей (xfields.json).'
      properties:
        fields:
          type: object
          description: 'Карта полей: имя → определение'
          additionalProperties:
            $ref: '#/components/schemas/PostXfieldField'
        groups:
